<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TORNEO DE TENIS</title>
  <style>
    :root {
      --primary-color: #2c3e50;
      --accent-color: #27ae60;
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --border-color: #e2e8f0;
      --text-color: #333333;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      color: var(--primary-color);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 25px;
    }

    /* Filtros por día */
    .filter-container {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 25px;
    }

    .filter-btn {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .filter-btn:hover, .filter-btn.active {
      background-color: var(--accent-color);
      color: white;
      border-color: var(--accent-color);
    }

    /* Grid de tarjetas de partidos */
    .matches-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 15px;
    }

    /* Mini Tarjeta de Partido */
    .match-card {
      background-color: var(--card-bg);
      border-radius: 8px;
      border: 1px solid var(--border-color);
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .match-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 6px;
      font-size: 0.85rem;
      font-weight: 700;
      color: #7f8c8d;
      text-transform: uppercase;
    }

    .match-date {
      font-weight: normal;
      font-size: 0.75rem;
    }

    /* Filas de Jugadores y Resultados */
    .player-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.95rem;
    }

    .player-name {
      font-weight: 600;
      color: var(--primary-color);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 180px;
    }

    .sets-container {
      display: flex;
      gap: 8px;
      font-weight: bold;
    }

    .set-score {
      background-color: #edf2f7;
      padding: 2px 6px;
      border-radius: 4px;
      min-width: 16px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 1. Título de la página -->
    <h1>TORNEO DE TENIS</h1>

    <!-- 2. Filtros de días -->
    <div id="filterContainer" class="filter-container">
      <button class="filter-btn active" onclick="filterByDay('all')">Todos</button>
    </div>

    <!-- 3. Lista de partidos en mini tarjetas -->
    <div id="matchesContainer" class="matches-grid">
      <!-- Las tarjetas se generan dinámicamente aquí -->
    </div>
  </div>

  <script>
    // Ejemplo de estructura de datos proveniente de Google Sheets
    // Columna 0: Marca temporal (Fecha y hora)
    // Columna 1: Categoría
    // Columna 2: Jugador 1
    // Columna 3: Jugador 2
    // Columna 4: Sets Jugador 1 (ej: "6 6")
    // Columna 5: Sets Jugador 2 (ej: "4 2")
    const rawSheetData = [
      ["2026-09-18 10:30:00", "Primera", "Juan Pérez", "Carlos Gómez", "6 6", "4 2"],
      ["2026-09-18 11:45:00", "Segunda", "Lucas Rossi", "Mateo Fernández", "4 6 10", "6 3 8"],
      ["2026-09-19 09:00:00", "Primera", "Gonzalo López", "Ariel Martínez", "6 7", "3 5"]
    ];

    let allMatches = [];

    // Formatear fecha tomando la Columna 0 (Marca Temporal)
    function parseRowData(data) {
      return data.map(row => {
        const rawTimestamp = row[0]; // Columna 0: Marca temporal
        const dateObj = new Date(rawTimestamp);
        
        // Obtener fecha limpia YYYY-MM-DD para filtrado
        const formattedDay = !isNaN(dateObj) 
          ? dateObj.toISOString().split('T')[0] 
          : rawTimestamp.split(' ')[0];

        return {
          day: formattedDay,
          category: row[1] || 'General',
          player1: row[2] || 'Jugador 1',
          player2: row[3] || 'Jugador 2',
          p1Sets: (row[4] || '').split(' '),
          p2Sets: (row[5] || '').split(' ')
        };
      });
    }

    // Inicializar la aplicación
    function init() {
      allMatches = parseRowData(rawSheetData);
      buildDayFilters();
      renderMatches(allMatches);
    }

    // Construir los botones de filtro basados en las fechas detectadas en la Columna 0
    function buildDayFilters() {
      const filterContainer = document.getElementById('filterContainer');
      const uniqueDays = [...new Set(allMatches.map(m => m.day))].sort();

      uniqueDays.forEach(day => {
        const btn = document.createElement('button');
        btn.className = 'filter-btn';
        btn.innerText = day;
        btn.onclick = () => filterByDay(day, btn);
        filterContainer.appendChild(btn);
      });
    }

    // Filtrar partidos por el día seleccionado
    function filterByDay(selectedDay, btnElement) {
      // Actualizar estado del botón activo
      const buttons = document.querySelectorAll('.filter-btn');
      buttons.forEach(btn => btn.classList.remove('active'));
      
      if (btnElement) {
        btnElement.classList.add('active');
      } else {
        buttons[0].classList.add('active');
      }

      // Filtrar partidos
      if (selectedDay === 'all') {
        renderMatches(allMatches);
      } else {
        const filtered = allMatches.filter(m => m.day === selectedDay);
        renderMatches(filtered);
      }
    }

    // Renderizar tarjetas de partidos
    function renderMatches(matches) {
      const container = document.getElementById('matchesContainer');
      container.innerHTML = '';

      if (matches.length === 0) {
        container.innerHTML = '<p>No hay partidos registrados para esta fecha.</p>';
        return;
      }

      matches.forEach(match => {
        const card = document.createElement('div');
        card.className = 'match-card';

        // Renderizado de la estructura solicitada
        card.innerHTML = `
          <div class="match-header">
            <span>${match.category}</span>
            <span class="match-date">${match.day}</span>
          </div>
          
          <!-- Fila Jugador 1 -->
          <div class="player-row">
            <span class="player-name">${match.player1}</span>
            <div class="sets-container">
              ${match.p1Sets.map(score => `<span class="set-score">${score}</span>`).join('')}
            </div>
          </div>

          <!-- Fila Jugador 2 (Paralelo Abajo) -->
          <div class="player-row">
            <span class="player-name">${match.player2}</span>
            <div class="sets-container">
              ${match.p2Sets.map(score => `<span class="set-score">${score}</span>`).join('')}
            </div>
          </div>
        `;

        container.appendChild(card);
      });
    }

    // Ejecutar al cargar la página
    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
